<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inGoya - Dream the Reality</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="audio-unmuted">
    <h1 id="main-title" class="header-title">inGoya</h1>

    <div id="top-right-buttons">
        <!-- Pulsante Partecipanti -->
        <div id="participants-button-container">
            <button id="participants-button" title="Participants">
                <i class="fas fa-users"></i>
            </button>
        </div>
        
        <!-- Contenitore per i like in alto a destra -->
        <div id="likes-container">
            <button id="like-button" title="Like">
                <i class="fas fa-heart filled-heart" style="display: none;"></i>
                <i class="far fa-heart unfilled-heart"></i>
            </button>
            <span id="like-count">0</span>
        </div>

        <!-- Pulsante di chiamata in alto a destra -->
        <div id="call-button-container">
            <button id="call-button" title="Call">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="6" cy="4" r="1.5"></circle>
                    <circle cx="12" cy="4" r="1.5"></circle>
                    <circle cx="18" cy="4" r="1.5"></circle>
                    <circle cx="6" cy="9" r="1.5"></circle>
                    <circle cx="12" cy="9" r="1.5"></circle>
                    <circle cx="18" cy="9" r="1.5"></circle>
                    <circle cx="6" cy="14" r="1.5"></circle>
                    <circle cx="12" cy="14" r="1.5"></circle>
                    <circle cx="18" cy="14" r="1.5"></circle>
                    <circle cx="6" cy="19" r="1.5"></circle>
                    <circle cx="12" cy="19" r="1.5"></circle>
                    <circle cx="18" cy="19" r="1.5"></circle>
                </svg>
            </button>
        </div>
    </div>


    <!-- Overlay per il tastierino di chiamata -->
    <div id="dialpad-overlay" class="hidden">
        <div id="dialpad-content">
            <h2>Inserisci ID Sessione</h2>
            <input type="text" id="dialpad-input" maxlength="6" pattern="[A-Z0-9]{6}" title="6 caratteri, solo lettere maiuscole e numeri" placeholder="es. Z12345">
            <div id="keypad">
                <button class="keypad-button" data-key="1">1</button>
                <button class="keypad-button" data-key="2">2</button>
                <button class="keypad-button" data-key="3">3</button>
                <button class="keypad-button" data-key="4">4</button>
                <button class="keypad-button" data-key="5">5</button>
                <button class="keypad-button" data-key="6">6</button>
                <button class="keypad-button" data-key="7">7</button>
                <button class="keypad-button" data-key="8">8</button>
                <button class="keypad-button" data-key="9">9</button>
                <button class="keypad-button" data-key="Z">Z</button>
                <button class="keypad-button" data-key="0">0</button>
                <button id="keypad-backspace" class="keypad-button" data-key="backspace"><i class="fas fa-backspace"></i></button>
            </div>
            <div class="dialpad-actions">
                <button id="dialpad-connect">Avvia</button>
                <button id="dialpad-dismiss">Annulla</button>
            </div>
        </div>
    </div>

    <!-- Modale dei Partecipanti -->
    <div id="participants-modal" class="hidden">
        <div id="participants-modal-content">
            <div class="participants-modal-header">
                <h2>Chi ti sta guardando</h2>
                <button id="participants-modal-close">&times;</button>
            </div>
            <ul id="participants-list">
                <!-- I partecipanti verranno aggiunti qui dinamicamente -->
            </ul>
        </div>
    </div>
    
    <!-- Contenitore principale per il video dell'utente e il loader iniziale -->
    <div id="video-container">
        <div class="video-inner">
            <video id="local-preview-overlay" autoplay playsinline muted></video>
            <video id="playback-video" autoplay playsinline muted></video>
        </div>
        <div id="loader">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- Sezione controlli che appare sopra il video -->
    <div id="controls-section">
        <div class="prompt-wrapper">
            <div class="prompt-container">
                <button id="camera-button" class="prompt-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <g transform="scale(0.8) translate(60 60)">
                            <path
                                d="M149.1 64.8L138.7 96H64C28.7 96 0 124.7 0 160V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V160c0-35.3-28.7-64-64-64H373.3L362.9 64.8C356.4 45.2 338.1 32 317.4 32H194.6C173.9 32 155.6 45.2 149.1 64.8zM256 192a96 96 0 1 1 0 192 96 96 0 1 1 0-192z" />
                        </g>
                    </svg>
                </button>
                <input type="text" id="prompt" placeholder="come vuoi vederti...">
                <button id="update-params-btn" class="prompt-button" disabled>
                    <svg class="mic-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                        <path
                            d="M192 0C139 0 96 43 96 96V256c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96zM64 216c0-21.9-16.1-40-36.9-44.4s-43.1 6.1-51.8 26.8S-7.8 243.9 13 252.6C33.9 257 64 239.9 64 216zm307.8-26.8c-8.7-20.7-30.9-32.5-51.8-28.1s-36.9 22.5-36.9 44.4c0 23.9 30.1 41 51.8 36.6s39.8-26.1 31-46.8zM192 448c-70.7 0-128-57.3-128-128H0c0 102.3 74.9 187.9 172.9 205.3c-2.4 4.8-3.5 10.4-3.5 16.2c0 17.7 14.3 32 32 32s32-14.3 32-32c0-5.8-1.1-11.4-3.5-16.2C337.1 407.9 412 322.3 412 220h-64c0 70.7-57.3 128-128 128z" />
                    </svg>
                    <span class="arrow-icon" style="font-size: 24px; line-height: 1;">&#10148;</span>
                </button>
            </div>
        </div>
    </div>

    <div id="interaction-buttons">
        <button id="mute-btn" title="Toggle Mute">
            <svg class="icon-unmuted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
            </svg>
            <svg class="icon-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
            </svg>
        </button>

        <button id="fullscreen-btn" title="Toggle Fullscreen">
            <svg class="icon-enter-fullscreen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M20.25 20.25v-4.5m0 4.5h-4.5m4.5 0L15 15m-6 0L3.75 20.25m16.5-16.5L15 9" />
            </svg>
            <svg class="icon-exit-fullscreen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 9L3.75 3.75M3.75 3.75h4.5m-4.5 0v4.5m12 6L20.25 20.25m0 0v-4.5m0 4.5h-4.5" />
            </svg>
        </button>
    </div>

    <div id="theia-slide" class="slide" style="display: none;">
        <video class="playback-video" autoplay playsinline muted></video>
    </div>

    <canvas id="theia-canvas"></canvas>
    <audio id="remote-audio" autoplay style="display: none;"></audio>

    <script>
        window.selfMode = true;
        window.audioManaged = true;
        const __app_id = "default-app-id";

          storageBucket: "ingoya-2209e.firebasestorage.app",
          messagingSenderId: "708336111684",
          appId: "1:708336111684:web:8a791a9f03b2d314bd2c11"
        });

    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="dat.gui.min.js"></script>
    <script type="text/javascript" src="caos.js"></script>
    <!-- <script type="module" src="interpreter.js"></script> -->
    <!-- <script type="module" src="screen_debugger.js"></script> -->
    <script type="module" src="Theia.js"></script>
    <script type="module" src="SocialLayer.js"></script>
    <script type="module" src="AppController.js"></script>
</body>

</html>
