<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InGoya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #F4F4F9;
            --container-bg: #FFFFFF;
            --accent-color: #6366F1;
            --text-color: #2D3748;
            --border-color: #E2E8F0;
            --success-color: #10B981;
            --error-color: #EF4444;
            --border-radius: 12px;
            --font-family-sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        body { margin: 0; padding: 1.5rem; box-sizing: border-box; background-color: var(--background-color); color: var(--text-color); font-family: var(--font-family-sans); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background-color: var(--container-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-lg); padding: 2.5rem 3rem; width: 100%; max-width: 420px; text-align: center; animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .login-card h1 { font-size: 2rem; font-weight: 700; margin: 0 0 0.5rem 0; }
        .login-card .subtitle { color: var(--text-color); opacity: 0.7; margin-bottom: 2.5rem; }
        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 2px solid var(--border-color); background-color: var(--background-color); color: var(--text-color); font-size: 1rem; font-family: var(--font-family-sans); box-sizing: border-box; transition: all 0.2s ease; }
        .input-group input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 1rem; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-md); transition: all 0.2s ease; margin-top: 1rem; }
        .button:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .button svg { width: 24px; height: 24px; }
        .primary-button { background: var(--accent-color); color: white; }
        .secondary-button { background: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); }
        .divider { display: flex; align-items: center; text-align: center; color: #a0aec0; margin: 2rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        .message { margin-top: 1.5rem; font-weight: 600; min-height: 20px; }
        .message.success { color: var(--success-color); }
        .message.error { color: var(--error-color); }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Bentornato!</h1>
        <p class="subtitle">Accedi o registrati per continuare.</p>
        
        <div class="input-group">
            <label for="login-identifier">Email o Username</label>
            <input type="text" id="login-identifier" required placeholder="mario.rossi / tuamail@esempio.com">
        </div>
        <div class="input-group">
            <label for="password">Password (opzionale)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="password-btn" class="button primary-button">Continua con Email/Password</button>
        
        <div class="divider">oppure</div>
        
        <button id="passkey-btn" class="button secondary-button">
             <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M12.963 2.286a.75.75 0 00-1.071 1.052A6.75 6.75 0 0115.75 12c0 2.454-1.305 4.61-3.25 5.75a.75.75 0 10.866 1.3A8.25 8.25 0 0017.25 12a8.25 8.25 0 00-4.287-7.214z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M11.637 2.543a.75.75 0 011.052-1.071 8.25 8.25 0 014.288 7.214 8.25 8.25 0 01-8.25 8.25.75.75 0 010-1.5 6.75 6.75 0 006.75-6.75 6.75 6.75 0 00-6.448-6.732.75.75 0 01-.29-1.468z" clip-rule="evenodd" /><path d="M9.75 10.5a.75.75 0 01.75-.75h.008a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75h-.008a.75.75 0 01-.75-.75v-.008zM8.25 12a.75.75 0 01.75-.75h.008a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v-.008zM9.75 13.5a.75.75 0 01.75-.75h.008a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75h-.008a.75.75 0 01-.75-.75v-.008zM6.75 10.5a.75.75 0 01.75-.75h.008a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75v-.008z" /><path fill-rule="evenodd" d="M4.5 9.75A.75.75 0 015.25 9h5.25a.75.75 0 010 1.5H6v9.75a.75.75 0 01-1.5 0V9.75z" clip-rule="evenodd" /></svg>
            <span>Continua con Passkey</span>
        </button>

        <p id="message" class="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
    <script>
        const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

        // Riferimenti agli elementi del DOM
        const loginIdentifierInput = document.getElementById('login-identifier');
        const passwordInput = document.getElementById('password');
        const passwordBtn = document.getElementById('password-btn');
        const passkeyBtn = document.getElementById('passkey-btn');
        const messageEl = document.getElementById('message');

        /**
         * Gestisce la risposta dal server (login/registrazione) e aggiorna l'UI.
         * @param {Response} response - L'oggetto Response della fetch.
         */
        async function handleAuthResponse(response) {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Qualcosa è andato storto.');
            }
            // --- MODIFICA CHIAVE ---
            // Non cerchiamo più un token, controlliamo solo se la richiesta ha avuto successo.
            if (data.success) {
                messageEl.textContent = 'Successo! Reindirizzamento in corso...';
                messageEl.className = 'message success';
                
                // Reindirizza l'utente alla pagina principale dopo un breve ritardo.
                setTimeout(() => {
                    window.location.href = '/ingoya.html';
                }, 1000);

            } else {
                throw new Error('Risposta del server non valida.');
            }
            // --- FINE MODIFICA ---
        }

        // --- GESTORE PER IL LOGIN/REGISTRAZIONE CON PASSWORD ---
        passwordBtn.addEventListener('click', async () => {
            const loginIdentifier = loginIdentifierInput.value;
            const password = passwordInput.value;

            if (!loginIdentifier || !password) {
                messageEl.textContent = 'Per favore, compila tutti i campi.';
                messageEl.className = 'message error';
                return;
            }
            messageEl.textContent = 'Verifica in corso...';
            messageEl.className = 'message';

            try {
                // Tenta prima di fare il login
                const loginRes = await fetch('/auth/login-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginIdentifier, password }),
                });

                if (loginRes.ok) {
                    await handleAuthResponse(loginRes);
                    return;
                }
                
                if (loginRes.status === 401) { // 401 Unauthorized
                    console.log("Login fallito, tento la registrazione...");
                    messageEl.textContent = 'Utente non trovato, provo a registrarlo...';
                    const registerRes = await fetch('/auth/register-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ loginIdentifier, password }),
                    });
                    await handleAuthResponse(registerRes);
                } else {
                    const errorData = await loginRes.json();
                    throw new Error(errorData.error || 'Login fallito.');
                }
            } catch (error) {
                console.error('Errore durante il processo con password:', error);
                messageEl.textContent = error.message;
                messageEl.className = 'message error';
            }
        });
        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault(); // evita l'invio di un form "fantasma"
                passwordBtn.click();    // scatena il click del bottone
            }
        });
        // --- GESTORE PER IL LOGIN/REGISTRAZIONE CON PASSKEY ---
        passkeyBtn.addEventListener('click', async () => {
            const loginIdentifier = loginIdentifierInput.value;
            if (!loginIdentifier) {
                messageEl.textContent = 'Per favore, inserisci un email o username.';
                messageEl.className = 'message error';
                return;
            }
            messageEl.textContent = 'In attesa della Passkey...';
            messageEl.className = 'message';

            try {
                const optionsRes = await fetch('/auth/passkey-options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginIdentifier }),
                });
                const options = await optionsRes.json();
                if (!optionsRes.ok) throw new Error(options.error);

                let responseData;
                if (options.attestation) {
                    responseData = await startRegistration(options);
                } else {
                    responseData = await startAuthentication(options);
                }

                const verifyRes = await fetch('/auth/verify-passkey', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginIdentifier, responseData }),
                });
                await handleAuthResponse(verifyRes);

            } catch (error) {
                console.error('Errore durante il processo Passkey:', error);
                if (error.name === 'AbortError' || error.name === 'NotAllowedError') {
                    messageEl.textContent = 'Operazione annullata.';
                    messageEl.className = 'message';
                } else {
                    messageEl.textContent = error.message || 'Qualcosa è andato storto con la Passkey.';
                    messageEl.className = 'message error';
                }
            }
        });
    </script>
</body>
</html>
